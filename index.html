<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نقابة أطباء الأسنان في سورية</title>
<style>
  :root{
    --bg:#0f1720; --panel:#16212e; --panel2:#1d2b3a; --line:#28384a;
    --text:#e8eef5; --muted:#93a4b7; --accent:#2f9e6b; --accent2:#37b37e;
    --danger:#e05656; --warn:#d89a3a; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Cairo","Segoe UI",system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--text)}
  a{color:var(--accent2);cursor:pointer}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}
  #login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px;width:100%;max-width:400px}
  .card h1{font-size:19px;margin:0 0 4px;text-align:center}
  .card p.sub{color:var(--muted);font-size:13px;text-align:center;margin:0 0 20px}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  input,select{width:100%;padding:11px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:15px}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .btn{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:700}
  .btn:hover{background:var(--accent2)}
  .btn:disabled{opacity:.6;cursor:default}
  .btn.sec{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:600}
  .btn.sm{width:auto;padding:8px 14px;margin-top:0;font-size:13px}
  .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
  .msg.err{color:var(--danger)} .msg.ok{color:var(--accent2)}
  .linkrow{margin-top:14px;text-align:center;font-size:13px}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header .logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-weight:800;color:#fff}
  header h2{font-size:16px;margin:0;flex:1}
  header button{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px}
  nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  nav button{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px}
  nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  main{max-width:920px;margin:0 auto;padding:18px 14px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  .panel h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
  .loading{color:var(--muted);font-size:14px;padding:14px 0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  td.k{color:var(--muted);width:40%;font-size:13px}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
  .badge.beta{background:rgba(216,154,58,.15);border-color:var(--warn);color:var(--warn)}
  img.thumb{max-width:200px;border-radius:10px;border:1px solid var(--line)}
  .empty{color:var(--muted);font-size:14px;padding:10px 0}
  .note{font-size:12px;color:var(--warn);background:rgba(216,154,58,.08);border:1px solid rgba(216,154,58,.3);border-radius:10px;padding:9px 11px;margin-bottom:12px}
  details.raw{margin-top:12px}
  details.raw summary{color:var(--muted);font-size:12px;cursor:pointer}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12px;direction:ltr;text-align:left}
  .actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .item .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20;padding:16px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 4px;font-size:17px}
  .modal .close{float:left;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
  .step{display:flex;gap:6px;margin-bottom:14px}
  .step span{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .step span.on{background:var(--accent)}
</style>
</head>
<body>

<!-- ===== login ===== -->
<section id="login">
  <form class="card" id="loginForm" autocomplete="on">
    <h1>نقابة أطباء الأسنان في سورية</h1>
    <p class="sub">سجّل الدخول بنفس بيانات التطبيق</p>
    <label for="u">اسم المستخدم</label>
    <input id="u" name="username" autocomplete="username" required>
    <label for="p">كلمة المرور</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="loginBtn">دخول</button>
    <div class="msg" id="loginMsg"></div>
    <div class="linkrow"><a id="forgotLink">نسيت كلمة المرور؟</a></div>
  </form>
</section>

<!-- ===== app shell ===== -->
<div id="app" class="hidden">
  <header>
    <div class="logo">د</div>
    <h2>حسابي · نقابة أطباء الأسنان</h2>
    <button id="logoutBtn">خروج</button>
  </header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>

<div id="modalRoot"></div>

<script>
const BASE = "https://api.syriadent.org.sy";
const $ = s => document.querySelector(s);
let TOKEN = localStorage.getItem("sd_token") || "";

// read tabs (GET + generic render). action tabs are handled specially by id.
const TABS = [
  { id:"profile",  label:"الملف الشخصي", path:"doctor/profile", action:"profile" },
  { id:"idcard",   label:"البطاقة",       path:"doctor/id_card" },
  { id:"status",   label:"حالة الحساب",   path:"doctor/status" },
  { id:"certs",    label:"الشهادات",      path:"certificate/doctor" },
  { id:"invoices", label:"الفواتير",      path:"doctors/invoices", action:"invoices" },
  { id:"payments", label:"المدفوعات",     path:"doctors/payments/" },
  { id:"transfer", label:"نقل الفرع",     path:"branch-transfer/my", action:"transfer" },
  { id:"notifs",   label:"الإشعارات",     path:"notifications/actions" },
  { id:"directory",label:"دليل الأطباء",  path:"doctor/all" },
  { id:"security", label:"الأمان",        action:"security" },
];

// ---- core fetch helpers ----
async function req(path, {method="GET", body=null, auth=true}={}){
  const res = await fetch(`${BASE}/${path}`, {
    method,
    headers:{ "Content-Type":"application/json", ...(auth&&TOKEN?{Authorization:`Bearer ${TOKEN}`}:{}) },
    body: body!=null ? JSON.stringify(body) : null,
  });
  let data=null; try{ data=await res.json(); }catch{}
  return { status:res.status, ok:res.ok, data };
}
async function api(path){ // GET protected, unwrap envelope
  const r = await req(path);
  if(r.status===401){ logout("انتهت الجلسة، سجّل الدخول من جديد"); throw new Error("401"); }
  if(!r.ok) throw new Error(msgOf(r.data) || `HTTP ${r.status}`);
  return r.data;
}
// write op: tries POST then PATCH then PUT until the route accepts the method (skips 404/405)
async function writeOp(path, body){
  let last=null;
  for(const m of ["POST","PATCH","PUT"]){
    const r = await req(path,{method:m, body});
    last=r;
    if(r.status!==404 && r.status!==405) break;
  }
  return last;
}
function msgOf(d){ const m=d&&d.message; return Array.isArray(m)?m.join("، "):(m||""); }

// ---- login ----
$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const msg=$("#loginMsg"), btn=$("#loginBtn");
  msg.className="msg"; msg.textContent=""; btn.disabled=true; btn.textContent="جارٍ الدخول…";
  try{
    const r = await req("auth/login",{method:"POST",auth:false,body:{user_name:$("#u").value.trim(),password:$("#p").value}});
    if(!r.ok) throw new Error(msgOf(r.data)||"فشل الدخول");
    const tok = pick(r.data,["accessToken","access_token"]) || pick(r.data&&r.data.data,["accessToken","access_token"]);
    if(!tok) throw new Error("لم يصل رمز الدخول من الخادم");
    TOKEN=tok; localStorage.setItem("sd_token",TOKEN); enterApp();
  }catch(err){ msg.classList.add("err"); msg.textContent=err.message; }
  finally{ btn.disabled=false; btn.textContent="دخول"; }
});
function pick(o,keys){ if(!o) return null; for(const k of keys) if(o[k]!=null) return o[k]; return null; }

function logout(note){
  TOKEN=""; localStorage.removeItem("sd_token");
  $("#app").classList.add("hidden"); $("#login").classList.remove("hidden");
  const m=$("#loginMsg"); m.className="msg"+(note?" err":""); m.textContent=note||"";
}
$("#logoutBtn").addEventListener("click",()=>logout(""));

// ---- shell ----
function enterApp(){
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  const nav=$("#tabs"); nav.innerHTML="";
  TABS.forEach((t,i)=>{
    const b=document.createElement("button"); b.textContent=t.label;
    b.onclick=()=>{ [...nav.children].forEach(c=>c.classList.remove("active")); b.classList.add("active"); openTab(t); };
    nav.appendChild(b);
    if(i===0){ b.classList.add("active"); openTab(t); }
  });
}
async function openTab(t){
  if(t.action==="security") return renderSecurity();
  const view=$("#view");
  view.innerHTML=`<div class="panel"><h3>${t.label}</h3><div class="loading">جارٍ التحميل…</div></div>`;
  try{
    const body = await api(t.path);
    const data = (body&&"data"in body)?body.data:body;
    view.innerHTML="";
    const panel=el("div","panel");
    panel.appendChild(hdr(t.label));
    if(t.action==="profile") panel.appendChild(profileActions(data));
    if(t.action==="transfer") panel.appendChild(transferActions());
    if(data==null||(Array.isArray(data)&&!data.length)) panel.appendChild(elText("div","empty","لا توجد بيانات"));
    else if(t.action==="invoices") panel.appendChild(invoiceList(data));
    else panel.appendChild(render(data));
    panel.appendChild(rawBlock(body));
    view.appendChild(panel);
  }catch(err){ if(err.message!=="401") $("#view").innerHTML=`<div class="panel">${hdr(t.label).outerHTML}<div class="empty">تعذّر التحميل: ${esc(err.message)}</div></div>`; }
}

// ---- profile view + edit ----
function profileActions(data){
  const wrap=el("div","actions-row");
  const b=btn("تعديل البيانات","sm sec");
  b.onclick=()=>openEditProfile(data&&data.data?data.data:data);
  wrap.appendChild(b);
  return wrap;
}
function openEditProfile(profile){
  const scalars=Object.entries(profile||{}).filter(([k,v])=>v==null||["string","number","boolean"].includes(typeof v));
  const body=el("div");
  body.appendChild(elText("div","note","تعديل البيانات يستخدم مسار doctor/update. عدّل الحقول ثم احفظ. إن رفض الخادم حقلاً سيظهر سبب الرفض بالأسفل."));
  const inputs={};
  scalars.forEach(([k,v])=>{
    const l=document.createElement("label"); l.textContent=prettyKey(k);
    const inp=document.createElement("input"); inp.value=v==null?"":v; inputs[k]=inp;
    body.append(l,inp);
  });
  modal("تعديل الملف الشخصي", body, async (setMsg)=>{
    const changed={};
    scalars.forEach(([k])=>{ const nv=inputs[k].value; if(String(nv)!==String(profile[k]==null?"":profile[k])) changed[k]=nv; });
    if(!Object.keys(changed).length){ setMsg("لم تُعدّل أي حقل","err"); return false; }
    const r=await writeOp("doctor/update",changed);
    setMsg(r.ok?"تم الحفظ":("تعذّر الحفظ: "+(msgOf(r.data)||("HTTP "+r.status))), r.ok?"ok":"err", r.data);
    if(r.ok) openTab(TABS.find(t=>t.id==="profile"));
    return r.ok;
  },"حفظ");
}

// ---- invoices + pay ----
function invoiceList(data){
  const arr=Array.isArray(data)?data:(data.items||data.invoices||[data]);
  const wrap=el("div");
  wrap.appendChild(elText("div","note","الدفع (بيتا): يستخدم set-payment-initiation و bbsf-payment مع رمز تحقق OTP. جرّبه، وإن اختلفت الحقول أرسِل لي الاستجابة الخام من الأسفل لأضبطه."));
  arr.forEach(inv=>{
    const it=el("div","item");
    const top=el("div","top");
    top.appendChild(elText("div","",`فاتورة ${esc(String(pick(inv,["invoice_id","id","invoiceId","number"])??""))}`));
    const amt=pick(inv,["amount","total","value"]);
    const pb=btn("دفع","sm"); pb.onclick=()=>openPay(inv);
    const right=el("div"); if(amt!=null) right.appendChild(elText("span","badge",`${esc(String(amt))}`));
    top.appendChild(right);
    it.appendChild(top);
    it.appendChild(render(inv));
    it.appendChild(pb);
    wrap.appendChild(it);
  });
  return wrap;
}
function openPay(inv){
  const invId=pick(inv,["invoice_id","id","invoiceId","number"]);
  const body=el("div");
  body.appendChild(elText("div","note","تدفّق تجريبي. اختر طريقة الدفع وأدخل رقم الموبايل ثم أرسِل، وأدخل رمز التحقق إن طُلب."));
  const lMethod=document.createElement("label"); lMethod.textContent="طريقة الدفع";
  const sel=document.createElement("select");
  [["sham_cash","شام كاش"],["bemo_bank","بنك بيمو"]].forEach(([v,t])=>{const o=document.createElement("option");o.value=v;o.textContent=t;sel.appendChild(o);});
  const lPhone=document.createElement("label"); lPhone.textContent="رقم الموبايل";
  const phone=document.createElement("input"); phone.placeholder="09xxxxxxxx";
  const otpWrap=el("div","hidden");
  const lOtp=document.createElement("label"); lOtp.textContent="رمز التحقق (OTP)";
  const otp=document.createElement("input"); otpWrap.append(lOtp,otp);
  body.append(lMethod,sel,lPhone,phone,otpWrap);
  modal("دفع فاتورة "+(invId??""), body, async (setMsg)=>{
    if(otpWrap.classList.contains("hidden")){
      const r=await writeOp("set-payment-initiation",{invoice_id:invId,payment_method:sel.value,phone:phone.value.trim()});
      setMsg(r.ok?"تم إرسال طلب الدفع، أدخل رمز التحقق":("تعذّر البدء: "+(msgOf(r.data)||("HTTP "+r.status))), r.ok?"ok":"err", r.data);
      if(r.ok) otpWrap.classList.remove("hidden");
      return false; // keep modal open for OTP
    } else {
      const r=await writeOp("payment-invoice",{invoice_id:invId,payment_method:sel.value,phone:phone.value.trim(),otp:otp.value.trim()});
      setMsg(r.ok?"تم تأكيد الدفع":("تعذّر التأكيد: "+(msgOf(r.data)||("HTTP "+r.status))), r.ok?"ok":"err", r.data);
      return r.ok;
    }
  },"إرسال");
}

// ---- branch transfer ----
function transferActions(){
  const wrap=el("div","actions-row");
  const b=btn("طلب نقل فرع","sm sec"); b.onclick=openTransfer; wrap.appendChild(b);
  return wrap;
}
async function openTransfer(){
  const body=el("div");
  body.appendChild(elText("div","note","اختر الفرع المطلوب النقل إليه. يستخدم branch-transfer/available-branches ثم branch-transfer."));
  const l=document.createElement("label"); l.textContent="الفرع"; const sel=document.createElement("select");
  sel.innerHTML=`<option>جارٍ التحميل…</option>`;
  const lNote=document.createElement("label"); lNote.textContent="ملاحظة (اختياري)"; const note=document.createElement("input");
  body.append(l,sel,lNote,note);
  try{
    const b=await api("branch-transfer/available-branches");
    const arr=(b&&b.data)?b.data:b; sel.innerHTML="";
    (Array.isArray(arr)?arr:[]).forEach(x=>{const o=document.createElement("option");o.value=pick(x,["id","branch_id"])??"";o.textContent=pick(x,["name","title","branch_name"])??JSON.stringify(x);sel.appendChild(o);});
    if(!sel.children.length) sel.innerHTML=`<option value="">لا توجد فروع متاحة</option>`;
  }catch(e){ sel.innerHTML=`<option value="">تعذّر تحميل الفروع</option>`; }
  modal("طلب نقل فرع", body, async (setMsg)=>{
    const r=await writeOp("branch-transfer",{branch_id:sel.value, note:note.value.trim()});
    setMsg(r.ok?"تم إرسال الطلب":("تعذّر الإرسال: "+(msgOf(r.data)||("HTTP "+r.status))), r.ok?"ok":"err", r.data);
    if(r.ok) openTab(TABS.find(t=>t.id==="transfer"));
    return r.ok;
  },"إرسال الطلب");
}

// ---- security: change password ----
function renderSecurity(){
  const view=$("#view"); view.innerHTML="";
  const panel=el("div","panel"); panel.appendChild(hdr("الأمان"));
  const b=btn("تغيير كلمة المرور","sm sec"); b.onclick=openChangePw;
  panel.appendChild(b); view.appendChild(panel);
}
function openChangePw(){
  const body=el("div");
  const l1=document.createElement("label"); l1.textContent="كلمة المرور الحالية"; const oldp=document.createElement("input"); oldp.type="password";
  const l2=document.createElement("label"); l2.textContent="كلمة المرور الجديدة"; const newp=document.createElement("input"); newp.type="password";
  const l3=document.createElement("label"); l3.textContent="تأكيد كلمة المرور"; const conf=document.createElement("input"); conf.type="password";
  body.append(l1,oldp,l2,newp,l3,conf);
  modal("تغيير كلمة المرور", body, async (setMsg)=>{
    if(newp.value!==conf.value){ setMsg("كلمتا المرور غير متطابقتين","err"); return false; }
    const r=await writeOp("user/password",{old_password:oldp.value,new_password:newp.value,confirm_password:conf.value});
    setMsg(r.ok?"تم تغيير كلمة المرور":("تعذّر التغيير: "+(msgOf(r.data)||("HTTP "+r.status))), r.ok?"ok":"err", r.data);
    return r.ok;
  },"تغيير");
}

// ---- forgot password (OTP flow) ----
$("#forgotLink").addEventListener("click",openForgot);
function openForgot(){
  let stage=0, resetToken="";
  const body=el("div");
  const steps=el("div","step"); steps.innerHTML=`<span class="on"></span><span></span><span></span>`;
  const l1=document.createElement("label"); l1.textContent="اسم المستخدم"; const uname=document.createElement("input");
  const otpWrap=el("div","hidden"); const lo=document.createElement("label"); lo.textContent="رمز التحقق (OTP)"; const otp=document.createElement("input"); otpWrap.append(lo,otp);
  const pwWrap=el("div","hidden");
  const lp=document.createElement("label"); lp.textContent="كلمة المرور الجديدة"; const np=document.createElement("input"); np.type="password";
  const lc=document.createElement("label"); lc.textContent="تأكيد كلمة المرور"; const cp=document.createElement("input"); cp.type="password";
  pwWrap.append(lp,np,lc,cp);
  body.append(steps,l1,uname,otpWrap,pwWrap);
  const m=modal("استعادة كلمة المرور", body, async (setMsg)=>{
    if(stage===0){
      const r=await writeOp("auth/password-recovery/send-otp",{user_name:uname.value.trim()});
      setMsg(r.ok?"تم إرسال الرمز":("تعذّر الإرسال: "+(msgOf(r.data)||("HTTP "+r.status))), r.ok?"ok":"err", r.data);
      if(r.ok){ stage=1; otpWrap.classList.remove("hidden"); steps.children[1].classList.add("on"); m.setBtn("تحقق"); }
      return false;
    }
    if(stage===1){
      const r=await writeOp("auth/password-recovery/verify-otp",{user_name:uname.value.trim(),otp:otp.value.trim()});
      resetToken = pick(r.data,["reset_token"]) || pick(r.data&&r.data.data,["reset_token"]) || "";
      setMsg(r.ok?"تم التحقق، أدخل كلمة المرور الجديدة":("رمز غير صحيح: "+(msgOf(r.data)||("HTTP "+r.status))), r.ok?"ok":"err", r.data);
      if(r.ok){ stage=2; pwWrap.classList.remove("hidden"); steps.children[2].classList.add("on"); m.setBtn("حفظ"); }
      return false;
    }
    if(np.value!==cp.value){ setMsg("كلمتا المرور غير متطابقتين","err"); return false; }
    const r=await writeOp("auth/password-recovery/reset-password",{reset_token:resetToken,new_password:np.value,confirm_password:cp.value,user_name:uname.value.trim()});
    setMsg(r.ok?"تم تغيير كلمة المرور، يمكنك الدخول الآن":("تعذّر: "+(msgOf(r.data)||("HTTP "+r.status))), r.ok?"ok":"err", r.data);
    return r.ok;
  },"إرسال الرمز");
}

// ---- generic renderer ----
function render(v){
  if(Array.isArray(v)){
    const wrap=el("div"); if(!v.length){ return elText("div","empty","لا توجد عناصر"); }
    v.forEach((item,i)=>{ const c=el("div","item"); c.appendChild(elText("div","badge",`#${i+1}`)); c.appendChild(render(item)); wrap.appendChild(c); });
    return wrap;
  }
  if(v&&typeof v==="object"){
    const t=document.createElement("table");
    for(const [k,val] of Object.entries(v)){
      const tr=document.createElement("tr");
      const a=document.createElement("td"); a.className="k"; a.textContent=prettyKey(k);
      const b=document.createElement("td"); b.appendChild(leaf(k,val));
      tr.append(a,b); t.appendChild(tr);
    }
    return t;
  }
  return leaf("",v);
}
function leaf(key,val){
  if(val==null) return elText("span","empty","—");
  if(typeof val==="object") return render(val);
  const s=String(val), abs=s.startsWith("/")?BASE+s:s;
  const isImg=/\.(png|jpe?g|webp|gif)$/i.test(s) && /^(https?:|\/)/i.test(s);
  const isUrl=/^https?:\/\//i.test(s)||/^\/[\w./%-]+$/.test(s);
  if(isImg){ const im=document.createElement("img"); im.className="thumb"; im.src=abs; im.alt=key; return im; }
  if(isUrl){ const a=document.createElement("a"); a.href=abs; a.target="_blank"; a.textContent=s; return a; }
  return elText("span","",s);
}

// ---- tiny dom helpers ----
function el(tag,cls){ const e=document.createElement(tag); if(cls)e.className=cls; return e; }
function elText(tag,cls,txt){ const e=el(tag,cls); e.textContent=txt; return e; }
function btn(txt,cls){ const b=el("button","btn "+(cls||"")); b.textContent=txt; return b; }
function hdr(txt){ const h=el("h3"); h.textContent=txt; return h; }
function rawBlock(body){ const d=el("details","raw"); d.innerHTML=`<summary>عرض الاستجابة الخام (JSON)</summary><pre>${esc(JSON.stringify(body,null,2))}</pre>`; return d; }
function prettyKey(k){ return String(k).replace(/[_-]+/g," ").replace(/\b\w/g,c=>c.toUpperCase()); }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

// ---- modal builder. onSubmit(setMsg)->bool (true closes). setMsg(text,kind,rawData) ----
function modal(title, bodyEl, onSubmit, submitLabel){
  const root=$("#modalRoot");
  const ov=el("div","overlay");
  const box=el("div","modal");
  const close=el("button","close"); close.innerHTML="&times;"; close.onclick=()=>root.innerHTML="";
  const h=el("h3"); h.textContent=title;
  const msg=el("div","msg"); const rawHolder=el("div");
  const sb=btn(submitLabel||"إرسال");
  box.append(close,h,bodyEl,sb,msg,rawHolder); ov.appendChild(box); root.innerHTML=""; root.appendChild(ov);
  ov.addEventListener("click",e=>{ if(e.target===ov) root.innerHTML=""; });
  const setMsg=(text,kind,raw)=>{ msg.className="msg"+(kind?(" "+kind):""); msg.textContent=text;
    rawHolder.innerHTML=""; if(raw!=null) rawHolder.appendChild(rawBlock(raw)); };
  sb.onclick=async ()=>{ sb.disabled=true; const old=sb.textContent; sb.textContent="…";
    try{ const done=await onSubmit(setMsg); if(done) root.innerHTML=""; }
    catch(e){ setMsg(e.message,"err"); } finally{ sb.disabled=false; sb.textContent=old; } };
  return { setBtn:(t)=>{sb.textContent=t;}, close:()=>root.innerHTML="" };
}
