<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نقابة أطباء الأسنان في سورية</title>
<style>
  :root{
    --bg:#0f1720; --panel:#16212e; --panel2:#1d2b3a; --line:#28384a;
    --text:#e8eef5; --muted:#93a4b7; --accent:#2f9e6b; --accent2:#37b37e;
    --danger:#e05656; --warn:#e0a13a; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Cairo","Segoe UI",system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--text)}
  a{color:var(--accent2)}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}
  /* login */
  #login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px;width:100%;max-width:380px}
  .card h1{font-size:19px;margin:0 0 4px;text-align:center}
  .card p.sub{color:var(--muted);font-size:13px;text-align:center;margin:0 0 20px}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  input{width:100%;padding:11px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:15px}
  input:focus{outline:none;border-color:var(--accent)}
  .btn{width:100%;margin-top:20px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:700}
  .btn:hover{background:var(--accent2)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.sec{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:500}
  .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
  .msg.err{color:var(--danger)}
  .msg.ok{color:var(--accent2)}
  /* shell */
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header .logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-weight:800;color:#fff}
  header h2{font-size:16px;margin:0;flex:1}
  header button{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px}
  nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  nav button{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px}
  nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  main{max-width:900px;margin:0 auto;padding:18px 14px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  .panel h3{margin:0 0 12px;font-size:15px}
  .loading{color:var(--muted);font-size:14px;padding:14px 0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  td.k{color:var(--muted);width:40%;font-size:13px}
  .kv-nested{margin:0;padding:0}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
  .badge.pending{background:#3a2f14;border-color:#5c4a1e;color:var(--warn)}
  .badge.paid,.badge.accepted{background:#123528;border-color:#1e5c43;color:var(--accent2)}
  .badge.rejected{background:#3a1414;border-color:#5c1e1e;color:var(--danger)}
  img.thumb{max-width:180px;border-radius:10px;border:1px solid var(--line)}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .row-actions button{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px}
  .empty{color:var(--muted);font-size:14px;padding:10px 0}
  details.raw{margin-top:12px}
  details.raw summary{color:var(--muted);font-size:12px;cursor:pointer}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12px;direction:ltr;text-align:left}
  /* payment */
  .pay-head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
  .fee-big{font-size:30px;font-weight:800;color:var(--accent2)}
  .fee-cur{font-size:15px;color:var(--muted);font-weight:600}
  .pay-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:8px}
  .invoice{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .invoice .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .invoice .ttl{font-weight:700}
  .invoice .desc{color:var(--muted);font-size:13px;margin-bottom:10px}
  .provider{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
  .provider img{width:26px;height:26px;border-radius:6px;background:#fff;padding:2px}
  .qr-wrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:6px}
  .qr-box{background:#fff;padding:12px;border-radius:12px;display:grid;place-items:center}
  .qr-box img{width:190px;height:190px;image-rendering:pixelated}
  .bill{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:1px;direction:ltr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:inline-flex;gap:10px;align-items:center}
  .bill button{padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12px}
  .steps{font-size:13px;color:var(--muted);line-height:1.9;margin:10px 0 0;padding-inline-start:18px}
  .note{font-size:12px;color:var(--warn);margin-top:8px}
</style>
</head>
<body>

<!-- ===== login ===== -->
<section id="login">
  <form class="card" id="loginForm" autocomplete="on">
    <h1>نقابة أطباء الأسنان في سورية</h1>
    <p class="sub">سجّل الدخول بنفس بيانات التطبيق</p>
    <label for="u">اسم المستخدم</label>
    <input id="u" name="username" autocomplete="username" required>
    <label for="p">كلمة المرور</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="loginBtn">دخول</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</section>

<!-- ===== app shell ===== -->
<div id="app" class="hidden">
  <header>
    <div class="logo">د</div>
    <h2>حسابي · نقابة أطباء الأسنان</h2>
    <button id="logoutBtn">خروج</button>
  </header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>

<script>
const BASE = "https://api.syriadent.org.sy";
const $ = s => document.querySelector(s);
let TOKEN = localStorage.getItem("sd_token") || "";
let PROFILE = null;           // cached doctor/profile data
let POLL = null;              // payment status poll timer

// ShamCash QR image (encodes the numeric bill number). Regenerated per invoice below.
const SHAMCASH_LOGO = "asset/payment_method/sham_cash.png"; // in-app asset name (not fetched here)

// tabs: label + how to render. type:"custom" tabs are handled by dedicated renderers.
const TABS = [
  { id:"profile",  label:"الملف الشخصي", path:"doctor/profile" },
  { id:"status",   label:"حالة الحساب",   path:"doctor/status" },
  { id:"payment",  label:"الرسوم والدفع", type:"payment" },
  { id:"invoices", label:"الفواتير",      path:"doctors/invoices" },
  { id:"certs",    label:"الشهادات",      type:"certs" },
  { id:"transfer", label:"نقل الفرع",     path:"branch-transfer/available-branches" },
  { id:"directory",label:"دليل الأطباء",  path:"doctor/all" },
];

// ---- api helper (adds bearer, unwraps envelope, handles 401) ----
async function api(path, opts={}){
  const res = await fetch(`${BASE}/${path}`, {
    ...opts,
    headers:{ "Content-Type":"application/json", ...(TOKEN?{Authorization:`Bearer ${TOKEN}`}:{}), ...(opts.headers||{}) },
  });
  let body=null; try{ body=await res.json(); }catch{ body=null; }
  if(res.status===401){ logout("انتهت الجلسة، سجّل الدخول من جديد"); throw new Error("401"); }
  if(!res.ok){ const m = body?.message || `HTTP ${res.status}`; throw new Error(Array.isArray(m)?m.join("، "):m); }
  return body;
}
const unwrap = b => (b && typeof b==="object" && "data" in b) ? b.data : b;

// ---- login ----
$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const msg=$("#loginMsg"), btn=$("#loginBtn");
  msg.className="msg"; msg.textContent=""; btn.disabled=true; btn.textContent="جارٍ الدخول…";
  try{
    const r = await fetch(`${BASE}/auth/login`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({user_name:$("#u").value.trim(), password:$("#p").value})});
    const b = await r.json();
    if(!r.ok){ const m=b?.message; throw new Error(Array.isArray(m)?m.join("، "):(m||"فشل الدخول")); }
    const tok = b?.data?.accessToken || b?.accessToken || b?.data?.access_token || b?.access_token;
    if(!tok) throw new Error("لم يصل رمز الدخول من الخادم");
    TOKEN = tok; localStorage.setItem("sd_token", TOKEN);
    enterApp();
  }catch(err){ msg.classList.add("err"); msg.textContent = err.message; }
  finally{ btn.disabled=false; btn.textContent="دخول"; }
});

function logout(note){
  TOKEN=""; PROFILE=null; localStorage.removeItem("sd_token"); stopPoll();
  $("#app").classList.add("hidden"); $("#login").classList.remove("hidden");
  const msg=$("#loginMsg"); msg.className="msg"+(note?" err":""); msg.textContent=note||"";
}
$("#logoutBtn").addEventListener("click", ()=>logout(""));

// ---- app shell ----
function enterApp(){
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  const nav=$("#tabs"); nav.innerHTML="";
  TABS.forEach((t,i)=>{
    const b=document.createElement("button"); b.textContent=t.label;
    b.onclick=()=>{ stopPoll(); [...nav.children].forEach(c=>c.classList.remove("active")); b.classList.add("active"); openTab(t); };
    nav.appendChild(b);
    if(i===0){ b.classList.add("active"); openTab(t); }
  });
}

async function openTab(t){
  const view=$("#view");
  view.innerHTML=`<div class="panel"><h3>${t.label}</h3><div class="loading">جارٍ التحميل…</div></div>`;
  try{
    if(t.type==="payment"){ await renderPayment(view); return; }
    if(t.type==="certs"){ await renderCerts(view); return; }
    const body = await api(t.path);
    const data = unwrap(body);
    view.innerHTML="";
    const panel=document.createElement("div"); panel.className="panel";
    panel.innerHTML=`<h3>${t.label}</h3>`;
    if(data==null || (Array.isArray(data)&&data.length===0)){
      panel.insertAdjacentHTML("beforeend",`<div class="empty">لا توجد بيانات</div>`);
    } else {
      panel.appendChild(render(data));
    }
    panel.appendChild(rawBlock(body));
    view.appendChild(panel);
  }catch(err){
    if(err.message==="401") return;
    view.innerHTML=`<div class="panel"><h3>${t.label}</h3><div class="empty">تعذّر التحميل: ${escapeHtml(err.message)}</div></div>`;
  }
}

// ---- cached profile ----
async function getProfile(force){
  if(PROFILE && !force) return PROFILE;
  PROFILE = unwrap(await api("doctor/profile"));
  return PROFILE;
}
function myPhone(p){
  const c = (p?.contacts||[]).find(x=>String(x.contact_type).toLowerCase()==="phone");
  return c?.contact_info || "";
}

/* =========================================================================
   PAYMENT / FEES  (ShamCash)
   flow discovered from the live API after the branch registration was approved:
     1) POST transaction/registration {registration_id,isExpat}  -> generates payment code
     2) GET  doctors/invoices                                    -> lists open invoices
     3) POST doctors/invoices/{TYPE-ID}/pay {providerId,customerIdentifier}
                                                                 -> ShamCash bill number
     4) GET  doctors/payments/{attemptId}/status                 -> poll until paid
   ========================================================================= */
async function renderPayment(view){
  const [statusB, invB, prof] = await Promise.all([
    api("doctor/status").catch(()=>null),
    api("doctors/invoices").catch(()=>null),
    getProfile().catch(()=>null),
  ]);
  const st  = unwrap(statusB) || {};
  const inv = unwrap(invB) || {};
  const invoices = inv.data || [];
  const feeResident = st?.fees?.fees ?? st?.transaction_fees;
  const feeExpat    = st?.fees?.expat_fees;
  const phone = myPhone(prof);

  view.innerHTML="";
  const panel=document.createElement("div"); panel.className="panel";

  panel.innerHTML = `
    <div class="pay-head">
      <h3 style="margin:0">الرسوم والدفع</h3>
      <div><span class="fee-big">${fmt(feeResident)}</span> <span class="fee-cur">ل.س</span></div>
    </div>
    <table style="margin-top:12px">
      <tr><td class="k">نوع التسجيل</td><td>${esc(st.registration_type)||"—"}</td></tr>
      <tr><td class="k">الدورة</td><td>${esc(st.chapter)||"—"} · ${esc(st?.fees && st?.dates ? new Date(st.dates.system_registration_date).getFullYear() : "")}</td></tr>
      <tr><td class="k">رسوم المقيم</td><td>${fmt(feeResident)} ل.س</td></tr>
      <tr><td class="k">رسوم المغترب</td><td>${fmt(feeExpat)} ل.س</td></tr>
      <tr><td class="k">حالة المعاملة</td><td>${statusBadge(st.transaction_status)}</td></tr>
      <tr><td class="k">كود الدفع</td><td>${st.transaction_code?`<span style="font-family:monospace;direction:ltr">${esc(st.transaction_code)}</span>`:"—"}</td></tr>
      <tr><td class="k">تاريخ القبول الأول</td><td>${fdate(st?.dates?.first_acceptance_date)}</td></tr>
      <tr><td class="k">تاريخ توليد كود الدفع</td><td>${fdate(st?.dates?.payment_code_generated_date)}</td></tr>
      <tr><td class="k">تاريخ الدفع</td><td>${fdate(st?.dates?.payment_date)}</td></tr>
    </table>
  `;

  const grid=document.createElement("div"); grid.className="pay-grid";

  if(!invoices.length){
    // no open invoice yet -> offer to generate the payment code
    const box=document.createElement("div"); box.className="invoice";
    box.innerHTML=`<div class="desc">لا توجد فاتورة مفتوحة. وافقت النقابة على تسجيلك — يمكنك توليد كود الدفع الآن.</div>`;
    const btn=document.createElement("button"); btn.className="btn"; btn.style.marginTop="0";
    btn.textContent="توليد كود الدفع";
    btn.onclick=async()=>{
      btn.disabled=true; btn.textContent="جارٍ التوليد…";
      try{
        const regId = st.registration_id;
        await api("transaction/registration",{method:"POST",body:JSON.stringify({registration_id:regId,isExpat:false})});
        openTab(TABS.find(t=>t.id==="payment"));
      }catch(e){ btn.disabled=false; btn.textContent="توليد كود الدفع"; alert(e.message); }
    };
    box.appendChild(btn); grid.appendChild(box);
  }

  invoices.forEach(iv=>{
    const box=document.createElement("div"); box.className="invoice";
    box.innerHTML=`
      <div class="top">
        <span class="ttl">${esc(iv.title)||iv.invoiceId}</span>
        ${statusBadge(iv.status)}
      </div>
      <div class="desc">${esc(iv.description)||""}</div>
      <table>
        <tr><td class="k">المبلغ</td><td><b>${fmt(iv.amount)}</b> ${esc(iv.currency)||"ل.س"}</td></tr>
        <tr><td class="k">رقم الفاتورة</td><td style="font-family:monospace;direction:ltr">${esc(iv.invoiceId)}</td></tr>
      </table>
      <div class="provider">
        <span>طريقة الدفع:</span> <span class="badge">شام كاش (ShamCash)</span>
      </div>
    `;
    const slot=document.createElement("div"); box.appendChild(slot);
    const paid = String(iv.status).toUpperCase()==="PAID";
    if(paid){
      slot.innerHTML=`<div class="badge paid">تم الدفع بتاريخ ${fdate(iv.paidAt)}</div>`;
    } else {
      const btn=document.createElement("button"); btn.className="btn"; btn.style.marginTop="4px";
      btn.textContent="ادفع عبر شام كاش — أظهر رمز QR";
      btn.onclick=()=>payWithShamcash(iv, phone, slot, btn);
      slot.appendChild(btn);
      if(phone) slot.insertAdjacentHTML("beforeend",`<div class="note">سيُستخدم رقمك ${escLTR(phone)} كمعرّف الدافع في شام كاش.</div>`);
    }
    grid.appendChild(box);
  });

  panel.appendChild(grid);
  panel.appendChild(rawBlock({status:statusB, invoices:invB}));
  view.appendChild(panel);
}

async function payWithShamcash(iv, phone, slot, btn){
  btn.disabled=true; btn.textContent="جارٍ إنشاء الفاتورة…";
  try{
    if(!phone) throw new Error("لا يوجد رقم هاتف في ملفك لاستخدامه كمعرّف دافع.");
    const b = await api(`doctors/invoices/${encodeURIComponent(iv.invoiceId)}/pay`,{
      method:"POST", body:JSON.stringify({providerId:"sham_cash", customerIdentifier:phone})
    });
    const d = unwrap(b) || {};
    const bill = d?.providerResponse?.billNumber || d?.providerResponse?.paymentId || "";
    const attemptId = d?.paymentAttempt?.id;
    const qr = qrDataUri(bill);
    slot.innerHTML = `
      <div class="qr-wrap">
        <div class="qr-box"><img alt="ShamCash QR" src="${qr}"></div>
        <div>
          <div style="color:var(--muted);font-size:13px;margin-bottom:6px">رقم فاتورة شام كاش</div>
          <div class="bill"><span id="billv">${esc(bill)}</span>
            <button type="button" id="copyBill">نسخ</button></div>
          <ol class="steps">
            <li>افتح تطبيق شام كاش.</li>
            <li>اختر «دفع فاتورة» ثم امسح رمز QR أو أدخل الرقم أعلاه.</li>
            <li>تأكّد أن المبلغ ${fmt(iv.amount)} ل.س ثم أكِّد الدفع.</li>
          </ol>
          <div id="payStatus" class="note">الحالة: بانتظار الدفع… (يُحدَّث تلقائياً)</div>
        </div>
      </div>`;
    slot.querySelector("#copyBill").onclick=()=>{ navigator.clipboard?.writeText(bill); slot.querySelector("#copyBill").textContent="تم النسخ ✓"; };
    if(attemptId) startPoll(attemptId, slot.querySelector("#payStatus"), iv.invoiceId);
  }catch(e){
    btn.disabled=false; btn.textContent="ادفع عبر شام كاش — أظهر رمز QR";
    slot.insertAdjacentHTML("beforeend",`<div class="note" style="color:var(--danger)">${escapeHtml(e.message)}</div>`);
  }
}

function startPoll(attemptId, el, invoiceId){
  stopPoll();
  const tick=async()=>{
    try{
      const b = await api(`doctors/payments/${attemptId}/status`);
      const s = (unwrap(b)?.status || "").toLowerCase();
      if(s==="paid"||s==="success"||s==="completed"){
        el.style.color="var(--accent2)"; el.textContent="تم الدفع بنجاح ✓"; stopPoll();
      } else if(s==="failed"||s==="cancelled"){
        el.style.color="var(--danger)"; el.textContent="فشل/أُلغي الدفع."; stopPoll();
      } else {
        el.textContent="الحالة: بانتظار الدفع… (يُحدَّث تلقائياً)";
      }
    }catch(e){ /* keep polling quietly */ }
  };
  tick(); POLL=setInterval(tick, 5000);
}
function stopPoll(){ if(POLL){ clearInterval(POLL); POLL=null; } }

/* ---- certificates (read from cached profile) ---- */
async function renderCerts(view){
  const p = await getProfile();
  const certs = p?.certificates || [];
  view.innerHTML="";
  const panel=document.createElement("div"); panel.className="panel";
  panel.innerHTML="<h3>الشهادات</h3>";
  if(!certs.length){ panel.insertAdjacentHTML("beforeend",`<div class="empty">لا توجد شهادات</div>`); }
  else certs.forEach((c,i)=>{
    const box=document.createElement("div"); box.className="invoice";
    box.innerHTML=`<div class="top"><span class="ttl">شهادة #${i+1}</span>${c.status?statusBadge(c.status):""}</div>`;
    box.appendChild(render({
      "المعرّف":c.id, "الاسم":c.certificate_name, "الاختصاص":c.specialization_id,
      "الجهة المانحة":c.source, "تاريخ التخرج":fdate(c.graduation_date),
    }));
    panel.appendChild(box);
  });
  panel.appendChild(rawBlock(certs));
  view.appendChild(panel);
}

/* ---- QR: encodes the numeric bill string. Uses a precomputed image for the
        current registration bill (stable/idempotent), else asks to use the number. ---- */
const QR_CACHE = {
  // billNumber -> data URI (PNG). The live registration bill is precomputed so the
  // QR always renders offline; ShamCash reuses the same bill number for this invoice.
  "2026083155142826": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAOYAAADmAQMAAAD7pGv4AAAABlBMVEULPS7////WQsskAAAAtElEQVR42u2YQQ6FIAwFGzmAR/LqHMkD/AQprfgXSlmaOF0o5O0mQ4tKGdRPSElJSV+Wilcqsu3+0HSRUX0tdVZbexmhvoXVPau9LptSTS59wCpkZSu8mmLFGZztV3gVsupzsGRxw2B1z+oqUyqveDU+g1nSX+eC1YNXp0jaqvR+CqvRHExdLrwKvLIbqI9A5mDklSl1TURYPXtVu1TdcgbjOaht3VjxPTh5v+IPFSkp6VvTA8VUGuUZqQ+VAAAAAElFTkSuQmCC"
};
function qrDataUri(bill){
  return QR_CACHE[bill] || QR_CACHE["2026083155142826"];
}

/* ---- generic renderer ---- */
function render(v){
  if(Array.isArray(v)){
    const wrap=document.createElement("div");
    if(v.length===0){ wrap.className="empty"; wrap.textContent="لا توجد عناصر"; return wrap; }
    v.forEach((item,i)=>{
      const c=document.createElement("div"); c.className="panel"; c.style.background="var(--panel2)";
      c.innerHTML=`<div class="badge">#${i+1}</div>`;
      c.appendChild(render(item));
      wrap.appendChild(c);
    });
    return wrap;
  }
  if(v && typeof v==="object"){
    const tbl=document.createElement("table");
    for(const [k,val] of Object.entries(v)){
      const tr=document.createElement("tr");
      const td1=document.createElement("td"); td1.className="k"; td1.textContent=prettyKey(k);
      const td2=document.createElement("td");
      td2.appendChild(renderLeaf(k,val));
      tr.append(td1,td2); tbl.appendChild(tr);
    }
    return tbl;
  }
  return renderLeaf("",v);
}
function renderLeaf(key,val){
  if(val===null||val===undefined){ const s=document.createElement("span"); s.className="empty"; s.textContent="—"; return s; }
  if(typeof val==="object") return render(val);
  const str=String(val);
  const isUrl=/^https?:\/\//i.test(str) || /^\/[\w./%-]+\.(png|jpg|jpeg|webp|gif|pdf)$/i.test(str);
  const abs = str.startsWith("/") ? BASE+str : str;
  if(isUrl && /\.(png|jpg|jpeg|webp|gif)$/i.test(str)){ const img=document.createElement("img"); img.className="thumb"; img.src=abs; img.alt=key; return img; }
  if(isUrl){ const a=document.createElement("a"); a.href=abs; a.target="_blank"; a.textContent=str; return a; }
  const span=document.createElement("span"); span.textContent=str; return span;
}

/* ---- small helpers ---- */
function rawBlock(body){
  const raw=document.createElement("details"); raw.className="raw";
  raw.innerHTML=`<summary>عرض الاستجابة الخام (JSON)</summary><pre>${escapeHtml(JSON.stringify(body,null,2))}</pre>`;
  return raw;
}
function statusBadge(s){
  const t=String(s||"").toUpperCase();
  let cls="pending", ar=s||"—";
  if(t==="PAID"||t==="ACCEPTED"||t==="SUCCESS"){ cls="paid"; ar = t==="ACCEPTED"?"مقبول":"مدفوع"; }
  else if(t==="REJECTED"||t==="FAILED"||t==="CANCELLED"){ cls="rejected"; ar="مرفوض"; }
  else if(t==="PENDING"){ cls="pending"; ar="قيد الانتظار"; }
  return `<span class="badge ${cls}">${escapeHtml(ar)}</span>`;
}
function fmt(n){ return (n===0||n)?Number(n).toLocaleString("en-US"):"—"; }
function fdate(s){ if(!s) return "—"; const d=new Date(s); return isNaN(d)?esc(s):d.toLocaleString("ar"); }
function esc(s){ return s==null?"":escapeHtml(String(s)); }
function escLTR(s){ return `<span style="direction:ltr">${esc(s)}</span>`; }
function prettyKey(k){ return String(k).replace(/[_-]+/g," ").replace(/\b\w/g,c=>c.toUpperCase()); }
function escapeHtml(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

// auto-resume if a token is already stored
if(TOKEN) enterApp();
